{% set name = "incqueryserver-jupyter" %}
{% set version = "0.24.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/incqueryserver-jupyter-{{ version }}.tar.gz
  sha256: cd6743e015aa92c9a49130324b285d495653bbb7e50802b9e59eea184849e37c

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - incqueryserver-api-python-client =={{ version }}
    - ipywidgets
    - mms-python-client
    - python >={{ python_min }}

test:
  imports:
    - iqs_jupyter
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/IncQueryLabs/incquery-server-jupyter
  license: Apache-2.0
  license_file: {{ environ["RECIPE_DIR"] }}/LICENSE
  summary: IncQuery Server Client Extensions for Jupyter and Python

extra:
  recipe-maintainers:
    - FuzesiMate
    - pappist
    - abelhegedus
    - ujhelyiz
    - bergmanngabor
